name: Release plugin

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - name: Check version, build and test
        run: |
          node --input-type=module -e 'import pkg from "./package.json" with {type:"json"}; if (process.env.RELEASE_TAG !== `v${pkg.version}`) throw new Error("Tag and package version differ");'
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm check
          pnpm build
          pnpm test
          node scripts/package-plugin.mjs > release.json
          node scripts/package-plugin.mjs --target=dsh > release-dsh.json
      - name: Publish Codex ZIP and DSH TGZ with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          archive=$(node -p 'JSON.parse(require("fs").readFileSync("release.json")).archive')
          dsh_archive=$(node -p 'JSON.parse(require("fs").readFileSync("release-dsh.json")).archive')
          gh release create "$RELEASE_TAG" "$archive" "$archive.sha256" "$dsh_archive" "$dsh_archive.sha256" --verify-tag --draft --title "GeoGebra Construction $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          gh release edit "$RELEASE_TAG" --draft=false --latest
