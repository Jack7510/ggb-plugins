name: Release plugin

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - name: Check version, build and test
        run: |
          node --input-type=module -e 'import pkg from "./package.json" with {type:"json"}; if (process.env.GITHUB_REF_NAME !== `v${pkg.version}`) throw new Error("Tag and package version differ");'
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm check
          pnpm build
          pnpm test
          node scripts/package-plugin.mjs > release.json
      - name: Publish ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          archive=$(node -p 'JSON.parse(require("fs").readFileSync("release.json")).archive')
          gh release create "$GITHUB_REF_NAME" "$archive" "$archive.sha256" --verify-tag --draft --title "GeoGebra Construction $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
